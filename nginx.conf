server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # toujours vérifier la dernière version de ces deux fichiers (mises à jour de l'app sur l'iPad)
  # no-store (et pas no-cache): Cloudflare ignore no-cache et garderait sw.js 4 h sur son edge
  location = /sw.js { add_header Cache-Control "no-store, max-age=0"; }
  # pages, scripts et styles: toujours revalider. Sans en-tête, Cloudflare ajoute max-age=14400 (4 h) et l'iPad
  # garde l'ancienne version pendant 4 h, même quand le service worker « prend le réseau d'abord ».
  location ~* \.(js|css|html)$ { add_header Cache-Control "no-store, max-age=0"; }
  location = / { add_header Cache-Control "no-store, max-age=0"; }
  location = /audio/manifest.json { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
}
