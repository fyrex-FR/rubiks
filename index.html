<!-- /PAGE -->
<script>
  // Mode hors ligne : le site (et les voix) restent sur l'iPad après la 1re visite
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then((reg) => reg.active && reg.active.postMessage('precache-audio'))
        .catch(() => { /* pas de hors ligne, tant pis */ });
    });
  }
</script>
</body>
